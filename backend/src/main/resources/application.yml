server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:smartlamp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

mqtt:
  broker: tcp://127.0.0.1:1883
  client-id: smartlamp-backend
  username:
  password:

# 大模型 API 配置（OpenAI 兼容协议，支持 OpenAI / DeepSeek / Kimi 等）
# 未配置 LLM_API_KEY 时智能体自动降级为本地知识库回答
llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:}
  # 单次模型请求超时（毫秒）：聊天链路最多 3 轮工具调用，前端聊天接口超时建议不小于 3×该值
  timeout-ms: 30000

agent:
  # Agent 确认执行后等待设备回执的窗口（毫秒）；置 0 表示不等待，直接返回 COMMAND_ACCEPTED
  ack-timeout-ms: 5000

data-retention:
  light-point-days: 30
  dead-letter-days: 7

# 分时亮度节能估算参数，可按当地电价和采用的碳排放核算口径覆盖。
energy-savings:
  electricity-price-yuan-per-kwh: ${ELECTRICITY_PRICE_YUAN_PER_KWH:0.60}
  carbon-factor-kg-per-kwh: ${CARBON_FACTOR_KG_PER_KWH:0.57}
