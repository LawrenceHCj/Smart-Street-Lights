<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <style>
      .bg { fill: #f5f7f4; }
      .title { font: 700 34px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #202624; }
      .subtitle { font: 400 16px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #66716c; }
      .role { fill: #123f39; }
      .roleText { font: 700 18px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #fff; }
      .module { fill: #fff; stroke: #dbe3dd; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .moduleTitle { font: 700 19px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #13776d; }
      .item { font: 400 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #202624; }
      .owner { font: 700 13px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #66716c; }
      .line { stroke: #8aa39c; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .softLine { stroke: #b8c8c2; stroke-width: 2; fill: none; marker-end: url(#arrowSoft); stroke-dasharray: 7 6; }
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e2a26" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa39c"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8c8c2"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="920"/>
  <text x="56" y="64" class="title">智慧路灯系统功能架构图</text>
  <text x="58" y="94" class="subtitle">第一阶段开发版本：数据监测、设备控制、告警管理、IoT 通信预留、AI 维护问答</text>

  <rect x="64" y="142" width="220" height="72" rx="12" class="role"/>
  <text x="174" y="186" text-anchor="middle" class="roleText">市政人员</text>

  <rect x="64" y="424" width="220" height="72" rx="12" class="role"/>
  <text x="174" y="468" text-anchor="middle" class="roleText">路灯管理员</text>

  <rect x="64" y="706" width="220" height="72" rx="12" class="role"/>
  <text x="174" y="750" text-anchor="middle" class="roleText">测试 / 运维人员</text>

  <rect x="380" y="128" width="260" height="180" class="module"/>
  <text x="410" y="164" class="moduleTitle">数据监测</text>
  <text x="410" y="199" class="item">实时光照监测</text>
  <text x="410" y="229" class="item">设备在线状态监控</text>
  <text x="410" y="259" class="item">路灯开关状态监控</text>
  <text x="410" y="289" class="owner">负责人：2号 / 3号 / 4号</text>

  <rect x="700" y="128" width="260" height="180" class="module"/>
  <text x="730" y="164" class="moduleTitle">设备控制</text>
  <text x="730" y="199" class="item">手动开灯 / 关灯</text>
  <text x="730" y="229" class="item">光照阈值自动控制</text>
  <text x="730" y="259" class="item">控制命令与执行回执</text>
  <text x="730" y="289" class="owner">负责人：2号 / 3号 / 4号</text>

  <rect x="1020" y="128" width="260" height="180" class="module"/>
  <text x="1050" y="164" class="moduleTitle">参数管理</text>
  <text x="1050" y="199" class="item">自动控制开关</text>
  <text x="1050" y="229" class="item">光照阈值配置</text>
  <text x="1050" y="259" class="item">心跳超时配置</text>
  <text x="1050" y="289" class="owner">负责人：2号 / 3号</text>

  <rect x="380" y="370" width="260" height="180" class="module"/>
  <text x="410" y="406" class="moduleTitle">设备管理</text>
  <text x="410" y="441" class="item">设备查询</text>
  <text x="410" y="471" class="item">设备新增</text>
  <text x="410" y="501" class="item">绑定 / 解绑 / 信息维护</text>
  <text x="410" y="531" class="owner">负责人：2号 / 3号</text>

  <rect x="700" y="370" width="260" height="180" class="module"/>
  <text x="730" y="406" class="moduleTitle">告警管理</text>
  <text x="730" y="441" class="item">离线告警生成</text>
  <text x="730" y="471" class="item">告警状态展示</text>
  <text x="730" y="501" class="item">恢复记录与历史查询</text>
  <text x="730" y="531" class="owner">负责人：2号 / 3号 / 6号</text>

  <rect x="1020" y="370" width="260" height="180" class="module"/>
  <text x="1050" y="406" class="moduleTitle">数据可视化</text>
  <text x="1050" y="441" class="item">首页指标卡</text>
  <text x="1050" y="471" class="item">历史光照趋势</text>
  <text x="1050" y="501" class="item">设备列表与告警列表</text>
  <text x="1050" y="531" class="owner">负责人：2号</text>

  <rect x="380" y="612" width="260" height="180" class="module"/>
  <text x="410" y="648" class="moduleTitle">IoT 模拟与通信</text>
  <text x="410" y="683" class="item">光照数据模拟</text>
  <text x="410" y="713" class="item">设备心跳模拟</text>
  <text x="410" y="743" class="item">MQTT Topic 预留</text>
  <text x="410" y="773" class="owner">负责人：4号</text>

  <rect x="700" y="612" width="260" height="180" class="module"/>
  <text x="730" y="648" class="moduleTitle">AI 维护智能体</text>
  <text x="730" y="683" class="item">维护知识问答</text>
  <text x="730" y="713" class="item">故障排查建议</text>
  <text x="730" y="743" class="item">Prompt 与 RAG 预留</text>
  <text x="730" y="773" class="owner">负责人：5号</text>

  <path class="line" d="M284 178 C324 178 335 190 380 205"/>
  <path class="line" d="M284 178 C450 88 930 88 1020 190"/>
  <path class="line" d="M284 460 C330 460 340 460 380 460"/>
  <path class="line" d="M284 460 C510 332 590 430 700 460"/>
  <path class="line" d="M284 460 C500 590 600 690 700 702"/>
  <path class="line" d="M284 742 C330 742 340 718 380 702"/>
  <path class="line" d="M284 742 C620 850 940 600 1020 500"/>

  <path class="softLine" d="M640 218 L700 218"/>
  <path class="softLine" d="M960 218 L1020 218"/>
  <path class="softLine" d="M640 460 L700 460"/>
  <path class="softLine" d="M960 460 L1020 460"/>
  <path class="softLine" d="M510 612 L510 550"/>
  <path class="softLine" d="M830 612 L830 550"/>
</svg>
